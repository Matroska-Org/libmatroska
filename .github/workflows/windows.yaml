name: "Windows"
on:
  push:
    branches: [ master ]
  pull_request:
    # branches: [ master ]

jobs:
  build_libmatroska:
    name: ${{ matrix.config }} libmatroska ${{ matrix.arch.name }} (${{ matrix.lib.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        lib: [
          { "name": "static", "option": "-DBUILD_SHARED_LIBS=OFF"},
          { "name": "shared", "option": "-DBUILD_SHARED_LIBS=ON"},
          { "name": "auto",   "option": ""},
        ]
        arch: [
          { "name": "x64",   "option": "x64"},
          { "name": "x86",   "option": "win32"},
          { "name": "arm64", "option": "arm64"},
        ]
    env:
      CMAKE_OPTIONS: -DDEV_MODE=ON -DCMAKE_CXX_FLAGS_INIT="-DWINVER=0x0501"
      CMAKE_MATROSKA_OPTIONS: -DBUILD_EXAMPLES=ON
    steps:
      - name: Get pushed code
        uses: actions/checkout@v7

      - name: Checkout libebml
        uses: actions/checkout@v7
        with:
          repository: Matroska-Org/libebml
          path: libebml
          # minimum version we support ref: 'release-1.4.3'

      - name: Configure libebml
        run: cmake -S libebml -B libebml/_build ${{ env.CMAKE_OPTIONS }} ${{ matrix.lib.option }} -A ${{ matrix.arch.option }}

      - name: Build libebml
        run: cmake --build libebml/_build --config ${{ matrix.config }} --parallel

      - name: Install libebml
        run: cmake --install libebml/_build --config ${{ matrix.config }} --prefix ${GITHUB_WORKSPACE}/_built

      - name: Configure library
        run: cmake -S . -B _build ${{ env.CMAKE_OPTIONS }} ${{ env.CMAKE_MATROSKA_OPTIONS }} -A ${{ matrix.arch.option }} ${{ matrix.lib.option }} -DEBML_DIR="${GITHUB_WORKSPACE}/_built/lib/cmake/EBML"

      - name: Build
        run: cmake --build _build --config ${{ matrix.config }} --parallel

      - name: Test installation
        run: cmake --install _build --config ${{ matrix.config }} --prefix ${GITHUB_WORKSPACE}/_built
